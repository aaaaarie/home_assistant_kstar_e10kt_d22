[project]
name = "kstar-lan"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = ["pymodbus==3.13.1"]

[project.optional-dependencies]
test = ["homeassistant==2026.10.0", "pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = false

[tool.setuptools.package-data]
"custom_components.kstar_lan" = ["*.json", "translations/*.json"]
